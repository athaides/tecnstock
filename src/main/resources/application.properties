spring.application.name=tecnstock
server.port=${PORT:8080}

# Local: usa o Postgres da sua máquina. Na hospedagem: usa as variáveis DB_URL, DB_USER e DB_PASSWORD (Neon)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tecn_stock}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:2005}

# Neon gratuito tem limite de conexões
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

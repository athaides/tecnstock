<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>TecnoStock - Dashboard</title>


  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


  <!-- CSS -->
  <link rel="stylesheet" href="css/produtos.css">


  <style>

    .grafico-card {

      width: 100%;

      background: #1e293b;

      border-radius: 16px;

      padding: 25px;

      margin-top: 25px;

      box-sizing: border-box;

      border: 1px solid #2e3e56;

    }


    .grafico-header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 20px;

      margin-bottom: 25px;

    }


    .grafico-header h2 {

      margin: 0;

      color: #ffffff;

    }


    .grafico-header p {

      margin-top: 6px;

      color: #94a3b8;

    }


    .grafico-acoes {

      display: flex;

      align-items: center;

      gap: 15px;

    }


    #statusAtualizacao {

      color: #94a3b8;

      font-size: 13px;

      white-space: nowrap;

    }


    #btnAtualizar {

      border: none;

      border-radius: 8px;

      padding: 10px 16px;

      background: #2563eb;

      color: white;

      font-size: 14px;

      font-weight: 600;

      cursor: pointer;

    }


    #btnAtualizar:hover {

      background: #1d4ed8;

    }


    #btnAtualizar:disabled {

      opacity: 0.6;

      cursor: not-allowed;

    }


    .grafico-container {

      position: relative;

      width: 100%;

      height: 400px;

    }


    @media (max-width: 768px) {

      .grafico-header {

        flex-direction: column;

        align-items: flex-start;

      }


      .grafico-acoes {

        width: 100%;

        flex-wrap: wrap;

      }


      .grafico-container {

        height: 300px;

      }

    }

  </style>

</head>


<body>


<div class="layout">


  <!-- MENU LATERAL -->

  <aside class="sidebar">

    <h2>TecnoStock</h2>

    <a href="dashboard.html">
      Principal
    </a>

    <a href="produtos.html">
      Produtos
    </a>

    <a href="usuarios.html">
      Usuários
    </a>

    <a href="fornecedores.html">
      Fornecedores
    </a>

    <a href="relatorios.html">
      📊 Relatórios
    </a>

  </aside>



  <!-- CONTEÚDO PRINCIPAL -->

  <main class="main-content">


    <div class="container">


      <header>

        <div>

          <h1>
            📦 TecnoStock
          </h1>

          <p>
            Gerenciamento de Produtos
          </p>

        </div>

      </header>



      <!-- GRÁFICO -->

      <div class="grafico-card">


        <div class="grafico-header">


          <div>

            <h2>
              Estoque por produto
            </h2>

            <p>
              Quantidade de produtos
              cadastrados no estoque
            </p>

          </div>



          <div class="grafico-acoes">


            <button
                    id="btnAtualizar"
                    onclick="carregarDashboard()">

              🔄 Atualizar

            </button>


            <span id="statusAtualizacao">

                            Aguardando atualização

                        </span>


          </div>


        </div>



        <!-- ÁREA DO GRÁFICO -->

        <div class="grafico-container">

          <canvas
                  id="graficoProdutos">
          </canvas>

        </div>


      </div>


    </div>


  </main>


</div>


<!-- JavaScript DO DASHBOARD -->
<script src="js/deashboard.js"></script>


</body>

</html>
